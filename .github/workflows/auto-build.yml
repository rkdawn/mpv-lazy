name: auto-build

# 跟随 mpv 官方 master 每日构建（shinchiro）：每天检查上游新构建，自动打包发布 Release
# 注：二进制源为 shinchiro/mpv-winbuild-cmake —— mpv 官方 Releases 的 CI 构建未启用
#     vapoursynth，补帧/AI 滤镜不可用；shinchiro 构建随 mpv master 每日更新且含 vapoursynth
on:
  schedule:
    - cron: '0 22 * * *'    # UTC 22:00 = 北京时间每天 06:00
  workflow_dispatch:
    inputs:
      force:
        description: '强制构建（忽略版本检查）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 查询 shinchiro 最新构建（mpv 官方 master 跟随源）
        id: upstream
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest' `
                   -Headers @{ 'User-Agent' = 'mpv-lazy-ci' }
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-x86_64-\d{8}-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "release $($rel.tag_name) 未找到 mpv-x86_64 资产" }
          # 构建标识：日期-git-hash（资产名去掉 .7z），如 20261001-git-3186d369f9
          $buildId = $asset.name -replace '\.7z$', ''
          "buildId=$buildId" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "shinchiro 最新构建: $buildId"

      - name: 检查是否已构建过该版本
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bid = '${{ steps.upstream.outputs.buildId }}'
          $existing = gh release list --repo $env:GITHUB_REPOSITORY --limit 50 |
                      Select-String -SimpleMatch $bid
          if ($existing -and '${{ inputs.force }}' -ne 'true') {
            "skip=true" | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "$bid 已构建过，跳过"
          } else {
            "skip=false" | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "需要构建 $bid"
          }

      - name: 构建懒人包
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        run: |
          $bid = '${{ steps.upstream.outputs.buildId }}'
          # buildId 形如 mpv-x86_64-20261001-git-3186d369f9 → 提取日期部分 20261001 作为 tag
          $dateTag = if ($bid -match '(\d{8})-git-') { $Matches[1] } else { $bid }
          Write-Host "构建日期 tag: $dateTag"
          pwsh -NoProfile -ExecutionPolicy Bypass -File build/build-package.ps1 -Y -Tag $dateTag
          Get-ChildItem dist

      - name: 构建后自动验证（不过检不发版）
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        run: |
          $pkg = Get-ChildItem dist -Directory | Select-Object -First 1
          $root = Get-ChildItem $pkg.FullName -Directory | Select-Object -First 1
          $errors = @()
          # 1. 关键文件存在且非空（防 lite 空 blob、构建源错位类事故）
          $need = @(
            'mpv.exe', 'mpv.com', 'VERSION.json',
            'portable_config/mpv.conf', 'portable_config/input_uosc.conf',
            'portable_config/menu.conf', 'portable_config/profiles.conf',
            'portable_config/script-opts.conf',
            'portable_config/scripts/uosc/main.lua',
            'portable_config/scripts/bookmark-skip.lua',
            'portable_config/scripts/thumb_engine/main.lua',
            'portable_config/fonts/LXGWWenKaiMonoLite-Regular.ttf',
            'portable_config/fonts/uosc_textures.ttf',
            'portable_config/shaders/FSRCNNX/FSRCNNX_x2_16_0_4_1.glsl',
            'portable_config/shaders/Anime4K/Anime4K_Restore_CNN_L.glsl',
            'portable_config/vs/MEMC_MVT_LQ.vpy',
            'python.exe', 'VSPipe.exe', 'VSScript.dll',
            'vs-plugins/mvtools.dll', 'yt-dlp.exe', 'umpv.exe',
            'mpv-lazy-patch.bat', 'updater/update-mpv.ps1'
          )
          foreach ($f in $need) {
            $p = Join-Path $root.FullName ($f -replace '/', [IO.Path]::DirectorySeparatorChar)
            if (-not (Test-Path $p)) { $errors += "缺失 $f" }
            elseif ((Get-Item $p).Length -eq 0) { $errors += "空文件 $f" }
          }
          # 2. vapoursynth 滤镜必须可用（防无 vs 的 mpv 构建混入成品）
          $vsOut = & (Join-Path $root.FullName 'mpv.com') --no-config --vf=vapoursynth=help 2>&1 | Out-String
          if ($vsOut -match "isn't supported" -or $LASTEXITCODE -ne 0) { $errors += 'mpv 不支持 vapoursynth' }
          # 3. 定制补丁已预应用（无边框标记 + 书签键位）
          $conf = Get-Content (Join-Path $root.FullName 'portable_config/mpv.conf') -Raw
          if ($conf -notmatch 'border\s*=\s*no') { $errors += '补丁未预应用: border=no 缺失' }
          $inp = Get-Content (Join-Path $root.FullName 'portable_config/input_uosc.conf') -Raw
          if ($inp -notmatch 'bookmark-mark-op') { $errors += '补丁未预应用: 书签键位缺失' }
          # 4. 出厂纯净（无运行时残留）
          if (Test-Path (Join-Path $root.FullName 'portable_config/saved-props.json')) { $errors += '含 saved-props.json 残留' }
          if (Test-Path (Join-Path $root.FullName 'portable_config/_cache')) { $errors += '含 _cache 残留' }
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::自动验证失败: $_" }
            exit 1
          }
          Write-Host "自动验证通过：$($need.Count) 个关键文件非空 + vapoursynth 可用 + 补丁已预应用 + 出厂纯净"

      - name: 发布 Release
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bid = '${{ steps.upstream.outputs.buildId }}'
          $tag = "auto-$bid"
          $archive = Get-ChildItem dist -Filter *.7z | Select-Object -First 1
          # force 重建场景：同 tag release 已存在则删除后重建，保证 Release 始终为最新构建
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag 已存在，删除重建"
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
          }
          $body = @"
          ## mpv-lazy 自动构建（定制成品）

          - mpv 主程序：**$bid**（[shinchiro 每日构建](https://github.com/shinchiro/mpv-winbuild-cmake/releases)，随 mpv 官方 master 更新，含 vapoursynth 补帧/AI 支持）
          - 附 VapourSynth 运行时：右键菜单「VF滤镜 > 补帧/自定义AI」开箱即用
          - 附 yt-dlp / umpv / 中文手册
          - 已预应用全部定制补丁，解压即用
          - 构建日期：$(Get-Date -Format 'yyyy-MM-dd HH:mm')

          更新请使用包内 ``updater\update-mpv.bat``。
          "@
          gh release create $tag $archive.FullName `
            --repo $env:GITHUB_REPOSITORY `
            --title "mpv-lazy · $bid" `
            --notes $body
